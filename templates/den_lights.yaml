- light:
    - name: Den Fan Light
      unique_id: den_fan_light
      state: "{{ is_state('light.smart_fan_3', 'on') and is_state('input_boolean.den_night_light_active', 'off') }}"
      turn_on:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.den_night_light_active
        - action: light.turn_on
          data:
            brightness_pct: "{{ states('input_number.den_fan_light_last_brightness') | int(77) }}"
            color_temp_kelvin: "{{ states('input_number.den_fan_light_last_color_temp') | int(6000) }}"
          target:
            entity_id: light.smart_fan_3
      turn_off:
        - action: light.turn_off
          target:
            entity_id: light.smart_fan_3
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.den_night_light_active
      level_template: "{{ (states('input_number.den_fan_light_last_brightness') | float(77) * 2.55) | round(0) }}"
      set_level:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.den_night_light_active
        - action: input_number.set_value
          data:
            value: "{{ (brightness / 2.55) | round(0) }}"
          target:
            entity_id: input_number.den_fan_light_last_brightness
        - action: light.turn_on
          data:
            brightness: "{{ brightness }}"
          target:
            entity_id: light.smart_fan_3
      temperature_template: "{{ (1000000 / (states('input_number.den_fan_light_last_color_temp') | float(6000))) | round(0) }}"
      set_temperature:
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.den_night_light_active
        - action: input_number.set_value
          data:
            value: "{{ (1000000 / color_temp) | round(0) }}"
          target:
            entity_id: input_number.den_fan_light_last_color_temp
        - action: light.turn_on
          data:
            color_temp_kelvin: "{{ (1000000 / color_temp) | round(0) }}"
          target:
            entity_id: light.smart_fan_3

    - name: Den Night Light
      unique_id: den_night_light
      state: "{{ is_state('light.smart_fan_3', 'on') and is_state('input_boolean.den_night_light_active', 'on') }}"
      turn_on:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.den_night_light_active
        - action: light.turn_on
          data:
            brightness_pct: "{{ states('input_number.den_night_light_last_brightness') | int(10) }}"
            color_temp_kelvin: "{{ states('input_number.den_night_light_last_color_temp') | int(3000) }}"
          target:
            entity_id: light.smart_fan_3
      turn_off:
        - action: light.turn_off
          target:
            entity_id: light.smart_fan_3
        - action: input_boolean.turn_off
          target:
            entity_id: input_boolean.den_night_light_active
      level_template: "{{ (states('input_number.den_night_light_last_brightness') | float(10) * 2.55) | round(0) }}"
      set_level:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.den_night_light_active
        - action: input_number.set_value
          data:
            value: "{{ (brightness / 2.55) | round(0) }}"
          target:
            entity_id: input_number.den_night_light_last_brightness
        - action: light.turn_on
          data:
            brightness: "{{ brightness }}"
          target:
            entity_id: light.smart_fan_3
      temperature_template: "{{ (1000000 / (states('input_number.den_night_light_last_color_temp') | float(3000))) | round(0) }}"
      set_temperature:
        - action: input_boolean.turn_on
          target:
            entity_id: input_boolean.den_night_light_active
        - action: input_number.set_value
          data:
            value: "{{ (1000000 / color_temp) | round(0) }}"
          target:
            entity_id: input_number.den_night_light_last_color_temp
        - action: light.turn_on
          data:
            color_temp_kelvin: "{{ (1000000 / color_temp) | round(0) }}"
          target:
            entity_id: light.smart_fan_3
