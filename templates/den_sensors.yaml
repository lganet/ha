- sensor:
    - name: Den PM2.5 Level
      unique_id: den_pm2_5_level
      icon: mdi:molecule
      state: >-
        {% set pm = states('sensor.office_air_purifier_pm2_5') | float(-1) %}
        {% if pm < 0 %}Unknown
        {% elif pm <= 12 %}Clean
        {% elif pm <= 35 %}Fair
        {% elif pm <= 55 %}Elevated
        {% elif pm <= 150 %}Poor
        {% else %}Severe{% endif %}

    - name: Den Light Level
      unique_id: den_light_level
      icon: mdi:brightness-6
      state: >-
        {% set lx = states('sensor.office_presence_fp300_illuminance') | float(0) %}
        {% if lx < 10 %}Dark
        {% elif lx < 50 %}Poor Light
        {% elif lx < 150 %}Soft Light
        {% elif lx < 350 %}Screen Work
        {% elif lx < 1000 %}Ideal for Work
        {% else %}Daylight{% endif %}

    - name: Den Lights On
      unique_id: den_lights_on
      unit_of_measurement: "on"
      state: >-
        {% set dfl_on = 1 if (is_state('light.office_floor_lamp_corner', 'on') or is_state('switch.office_floor_lamp_side_light', 'on') or is_state('switch.office_floor_lamp_bottom_light', 'on') or is_state('switch.office_floor_lamp_ripple_light', 'on')) else 0 %}
        {% set fan_on = 1 if (is_state('light.den_fan_light', 'on') or is_state('light.den_night_light', 'on') or is_state('light.office_ceiling_fan_backlight', 'on')) else 0 %}
        {% set ofl_on = 1 if is_state('light.office_floor_lamp', 'on') else 0 %}
        {% set leds_on = 1 if is_state('light.office_desk_leds', 'on') else 0 %}
        {% set hum_on = 1 if is_state('light.humidifier_night_light', 'on') else 0 %}
        {{ dfl_on + fan_on + ofl_on + leds_on + hum_on }}

    - name: Den Lights Off
      unique_id: den_lights_off
      unit_of_measurement: "off"
      state: >-
        {% set dfl_on = 1 if (is_state('light.office_floor_lamp_corner', 'on') or is_state('switch.office_floor_lamp_side_light', 'on') or is_state('switch.office_floor_lamp_bottom_light', 'on') or is_state('switch.office_floor_lamp_ripple_light', 'on')) else 0 %}
        {% set fan_on = 1 if (is_state('light.den_fan_light', 'on') or is_state('light.den_night_light', 'on') or is_state('light.office_ceiling_fan_backlight', 'on')) else 0 %}
        {% set ofl_on = 1 if is_state('light.office_floor_lamp', 'on') else 0 %}
        {% set leds_on = 1 if is_state('light.office_desk_leds', 'on') else 0 %}
        {% set hum_on = 1 if is_state('light.humidifier_night_light', 'on') else 0 %}
        {{ 5 - (dfl_on + fan_on + ofl_on + leds_on + hum_on) }}

    - name: Den Presence Status
      unique_id: den_presence_status
      icon: mdi:motion-sensor
      state: >-
        {% if is_state('input_boolean.den_presence_automation', 'off') %}
          Disabled
        {% elif is_state('input_boolean.den_presence_override', 'on') %}
          Paused (Resumes Tomorrow)
        {% elif is_state('binary_sensor.office_presence_fp300', 'on') %}
          Active (Occupied)
        {% else %}
          Active (Clear)
        {% endif %}

- binary_sensor:
    - name: Den Is Workday
      unique_id: den_is_workday
      icon: mdi:briefcase
      state: >-
        {{ now().weekday() < 5 and is_state('calendar.den_holidays', 'off') }}
