alias: Main Bedroom Lights Toggle
description: Toggles Main Bedroom lights contextually. If any bedroom lights are on, turns them off. If all are off, turns on the ceiling fan light (and ensures always-on Ceiling Light 1 line power is on). Leaves Patio Left light unaffected.
icon: mdi:theme-light-dark
mode: single
sequence:
  - choose:
      - conditions:
          - condition: or
            conditions:
              - condition: state
                entity_id: light.main_bedroom_fan_light
                state: "on"
              - condition: state
                entity_id: light.smart_fan_backlight_2
                state: "on"
              - condition: state
                entity_id: light.smart_fan_nightlight_2
                state: "on"
              - condition: state
                entity_id: light.main_bedroom_light_2
                state: "on"
              - condition: state
                entity_id: light.main_bedroom_closet_light
                state: "on"
        sequence:
          - action: light.turn_off
            target:
              entity_id:
                - light.main_bedroom_fan_light
                - light.smart_fan_backlight_2
                - light.smart_fan_nightlight_2
                - light.main_bedroom_light_2
                - light.main_bedroom_closet_light
    default:
      - if:
          - condition: state
            entity_id: light.main_bedroom_light_1
            state: "off"
        then:
          - action: light.turn_on
            target:
              entity_id: light.main_bedroom_light_1
      - action: light.turn_on
        target:
          entity_id: light.main_bedroom_fan_light
