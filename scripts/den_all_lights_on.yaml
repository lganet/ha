alias: Den All Lights On
description: Turn on all primary fixtures in the Den, optionally engaging daily presence override.
icon: mdi:lightbulb-group
mode: single
fields:
  override:
    description: "Whether to pause presence automation for the rest of the day"
    default: true
    selector:
      boolean: {}
sequence:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.den_night_light_active
  - if:
      - condition: template
        value_template: "{{ override | default(true) }}"
    then:
      - action: input_boolean.turn_on
        target:
          entity_id: input_boolean.den_presence_override
  - action: light.turn_on
    target:
      entity_id:
        - light.floor_lamp
        - light.office_leds
        - light.den_fan_light
  - action: switch.turn_on
    target:
      entity_id: switch.den_floor_lamp_side_light
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.den_lights_snapshot_active
