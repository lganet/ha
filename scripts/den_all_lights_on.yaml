alias: Den All Lights On
description: Restore previous Den lighting state from snapshot or fallback to primary fixtures.
icon: mdi:lightbulb-group
mode: single
sequence:
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.den_night_light_active
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ states.scene.den_lights_snapshot is not none }}"
        sequence:
          - action: scene.turn_on
            target:
              entity_id: scene.den_lights_snapshot
    default:
      - action: light.turn_on
        target:
          entity_id:
            - light.den_floor_lamp
            - light.office_leds
            - light.floor_lamp
            - light.den_fan_light
