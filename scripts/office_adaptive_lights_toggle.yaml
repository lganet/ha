alias: Office Adaptive Lights Toggle
description: Toggles Office lights contextually. If lights are on, turns them off. If all lights are off, activates Day Preset during workday hours (09:00-18:00) or Night Preset during off-hours/evening.
icon: mdi:theme-light-dark
mode: single
sequence:
  - choose:
      - conditions:
          - condition: numeric_state
            entity_id: sensor.den_lights_on
            above: 0
        sequence:
          - action: script.den_all_lights_off
    default:
      - choose:
          - conditions:
              - condition: state
                entity_id: binary_sensor.den_is_workday
                state: "on"
              - condition: time
                after: "09:00:00"
                before: "18:00:00"
            sequence:
              - action: script.office_activate_day_preset
        default:
          - action: script.office_activate_night_preset
