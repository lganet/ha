alias: Stream Patio Camera to Hub Display
description: Streams a selected Patio camera to Google Nest Hub Max for 5 minutes, then stops.
mode: restart
icon: mdi:cctv
fields:
  camera_entity:
    description: Camera entity to stream (e.g. camera.patio_left or camera.patio_right)
    example: camera.patio_left
    required: true
    selector:
      entity:
        domain: camera

sequence:
  # Safe P2P stream management for Eufy cameras
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ camera_entity == 'camera.patio_left' }}"
        sequence:
          - action: eufy_security.stop_p2p_livestream
            target:
              entity_id: camera.patio_right
            continue_on_error: true
      - conditions:
          - condition: template
            value_template: "{{ camera_entity == 'camera.patio_right' }}"
        sequence:
          - action: eufy_security.stop_p2p_livestream
            target:
              entity_id: camera.patio_left
            continue_on_error: true

  # Start P2P livestream on selected camera
  - action: eufy_security.start_p2p_livestream
    target:
      entity_id: "{{ camera_entity }}"
    continue_on_error: true

  # 5 minutes duration
  - delay: "00:05:00"

  # Stop livestream after 5 minutes
  - action: eufy_security.stop_p2p_livestream
    target:
      entity_id: "{{ camera_entity }}"
    continue_on_error: true
