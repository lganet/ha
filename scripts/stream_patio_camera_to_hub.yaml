alias: Stream Patio Camera to Hub Display
description: Streams a selected Patio camera to Google Nest Hub Max for 5 minutes via Google Assistant, then stops.
mode: restart
icon: mdi:cctv
fields:
  camera_entity:
    description: Camera entity to stream (camera.patio_left or camera.patio_right)
    example: camera.patio_left
    required: true
    selector:
      entity:
        domain: camera

sequence:
  # Send text command to Google Assistant to stream the camera on kitchen display
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ camera_entity == 'camera.patio_left' }}"
        sequence:
          - action: google_assistant_sdk.send_text_command
            data:
              command: "stream patio left camera on kitchen display"
      - conditions:
          - condition: template
            value_template: "{{ camera_entity == 'camera.patio_right' }}"
        sequence:
          - action: google_assistant_sdk.send_text_command
            data:
              command: "stream patio right camera on kitchen display"

  # Wait for 5 minutes as requested
  - delay: "00:05:00"

  # Stop streaming after 5 minutes
  - action: google_assistant_sdk.send_text_command
    data:
      command: "stop on kitchen display"
    continue_on_error: true
  - action: media_player.media_stop
    target:
      entity_id: media_player.kitchen_hub_display
    continue_on_error: true
