alias: Stream Patio Camera to Hub Display
description: Streams a selected Patio camera to Google Nest Hub Max for 5 minutes, then stops.
mode: restart
icon: mdi:cctv
fields:
  camera_entity:
    description: Camera entity to stream (e.g. camera.patio_left or camera.patio_right)
    example: camera.patio_left
    required: true
    selector:
      entity:
        domain: camera

sequence:
  # Stop opposite camera livestream safely if running
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ camera_entity == 'camera.patio_left' }}"
        sequence:
          - action: eufy_security.stop_p2p_livestream
            target:
              entity_id: camera.patio_right
            continue_on_error: true
      - conditions:
          - condition: template
            value_template: "{{ camera_entity == 'camera.patio_right' }}"
        sequence:
          - action: eufy_security.stop_p2p_livestream
            target:
              entity_id: camera.patio_left
            continue_on_error: true

  # Start P2P livestream on selected camera
  - action: eufy_security.start_p2p_livestream
    target:
      entity_id: "{{ camera_entity }}"
    continue_on_error: true

  - delay: "00:00:02"

  # Cast camera feed to Google Nest Hub Max via WebRTC Dash Cast
  - action: webrtc.dash_cast
    data:
      entity_id: media_player.kitchen_hub_display
      entity: "{{ camera_entity }}"
    continue_on_error: true

  # Wait for 5 minutes as requested
  - delay: "00:05:00"

  # Stop cast and stop livestream
  - action: media_player.media_stop
    target:
      entity_id: media_player.kitchen_hub_display
    continue_on_error: true

  - action: eufy_security.stop_p2p_livestream
    target:
      entity_id: "{{ camera_entity }}"
    continue_on_error: true
