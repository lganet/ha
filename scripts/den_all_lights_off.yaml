alias: Den All Lights Off
description: Turn off all lights in the Den and restore presence automation.
icon: mdi:lightbulb-group-off
mode: single
sequence:
  - action: homeassistant.turn_off
    target:
      label_id: den_controlled_lights
  - action: light.turn_off
    target:
      entity_id:
        - light.smart_fan_backlight
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.den_night_light_active
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.den_presence_override
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.den_presence_automation
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.den_lights_snapshot_active
