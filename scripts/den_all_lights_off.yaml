alias: Den All Lights Off
description: Turn off all lights in the Office and restore presence automation.
icon: mdi:lightbulb-group-off
mode: single
fields:
  sound:
    description: "Whether to play audio feedback chime on NSPanel"
    default: false
    selector:
      boolean: {}
sequence:
  - if:
      - condition: template
        value_template: "{{ sound | default(false) }}"
    then:
      - action: script.nspanel_audio_feedback
        data:
          tone: "{{ 'night_off' if is_state('input_boolean.den_night_light_active', 'on') else 'day_off' }}"
  - action: switch.turn_off
    target:
      entity_id:
        - switch.office_floor_lamp_side_light
        - switch.office_floor_lamp_bottom_light
        - switch.office_floor_lamp_ripple_light
  - delay:
      milliseconds: 300
  - action: light.turn_off
    target:
      entity_id:
        - light.office_floor_lamp
        - light.office_desk_leds
        - light.den_fan_light
        - light.office_ceiling_fan_light
        - light.humidifier_night_light
        - light.office_ceiling_fan_backlight
        - light.office_floor_lamp_corner
  - delay:
      milliseconds: 400
  - action: light.turn_off
    target:
      entity_id:
        - light.office_floor_lamp
        - light.office_floor_lamp_corner
        - light.office_desk_leds
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.den_night_light_active
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.den_presence_override
  - action: input_boolean.turn_on
    target:
      entity_id: input_boolean.den_presence_automation
  - action: input_boolean.turn_off
    target:
      entity_id: input_boolean.den_lights_snapshot_active
