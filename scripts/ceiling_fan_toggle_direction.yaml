alias: Ceiling Fan Toggle Direction
description: Toggles fan direction between forward and reverse
fields:
  entity_id:
    description: Fan entity to toggle
    example: fan.main_bedroom_ceiling_fan
    required: true
    selector:
      entity:
        domain: fan
sequence:
  - action: fan.set_direction
    target:
      entity_id: "{{ entity_id }}"
    data:
      direction: >-
        {{ 'reverse' if is_state_attr(entity_id, 'direction', 'forward') else 'forward' }}
mode: single
icon: mdi:rotate-3d-variant
