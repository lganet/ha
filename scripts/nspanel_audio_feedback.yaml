alias: NSPanel Audio Feedback
description: Plays audio or beep feedback on Sonoff NSPanel Pro.
icon: mdi:volume-high
mode: restart
fields:
  tone:
    description: "Audio tone type: day_on, day_off, night_on, night_off, save"
    default: "day_on"
    selector:
      select:
        options:
          - "day_on"
          - "day_off"
          - "night_on"
          - "night_off"
          - "save"
          - "on"
          - "off"
sequence:
  - variables:
      target_url: >-
        {% if tone in ['night_on'] %}
          https://actions.google.com/sounds/v1/cartoon/instrument_strum.ogg
        {% elif tone in ['night_off'] %}
          https://actions.google.com/sounds/v1/water/air_woosh_underwater.ogg
        {% elif tone in ['day_off', 'off'] %}
          https://actions.google.com/sounds/v1/cartoon/pop.ogg
        {% elif tone == 'save' %}
          https://actions.google.com/sounds/v1/office/button_push.ogg
        {% else %}
          https://actions.google.com/sounds/v1/alarms/beep_short.ogg
        {% endif %}
  - if:
      - condition: template
        value_template: "{{ states('text.zigbee2cube_1002a32fc7_audio_address') != target_url }}"
    then:
      - action: text.set_value
        target:
          entity_id: text.zigbee2cube_1002a32fc7_audio_address
        data:
          value: "{{ target_url }}"
  - action: button.press
    target:
      entity_id: button.zigbee2cube_1002a32fc7_speaker_start
