title: System & Diagnostics
views:
  - title: Sensors
    path: sensors
    icon: mdi:shield-check
    type: sections
    max_columns: 1
    theme: ios-dark-mode
    sections:
      - type: grid
        cards:
          # --- Return Navigation ---
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                name: "Office Panel"
                icon: mdi:briefcase
                layout: icon_name
                tap_action:
                  action: navigate
                  navigation_path: /nspanel-office/office
                styles:
                  card:
                    - height: 44px
                    - border-radius: 12px
                    - background-color: rgba(255, 255, 255, 0.08)
                  icon:
                    - width: 18px
                    - height: 18px
                  name:
                    - font-size: 13px
                    - font-weight: 600
              - type: custom:button-card
                name: "Bedroom Panel"
                icon: mdi:bed
                layout: icon_name
                tap_action:
                  action: navigate
                  navigation_path: /nspanel-main-bedroom/bedroom
                styles:
                  card:
                    - height: 44px
                    - border-radius: 12px
                    - background-color: rgba(255, 255, 255, 0.08)
                  icon:
                    - width: 18px
                    - height: 18px
                  name:
                    - font-size: 13px
                    - font-weight: 600
          - type: heading
            heading: Security & Locks
            heading_style: subtitle
            icon: mdi:lock

          - type: tile
