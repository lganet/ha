                name: Kitchen Door
                icon: mdi:door
                tap_action:
                  action: more-info
                  haptic: selection

              - type: tile
                entity: binary_sensor.patio_lock_door
                name: Patio Door
                icon: mdi:door
                tap_action:
                  action: more-info
                  haptic: selection

              - type: tile
                entity: binary_sensor.patio_fence_sensor
                name: Patio Fence Gate
                icon: mdi:gate
                tap_action:
                  action: more-info
                  haptic: selection

              - type: tile
                entity: binary_sensor.window_sensor_door
                name: Window Sensor
