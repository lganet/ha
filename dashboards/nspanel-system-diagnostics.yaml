                tap_action:
                  action: more-info
                  haptic: selection

          - type: heading
            heading: Motion & Presence
            heading_style: subtitle
            icon: mdi:motion-sensor

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: binary_sensor.office_presence_fp300
                name: Office FP300
                icon: mdi:motion-sensor
                tap_action:
                  action: more-info
                  haptic: selection

              - type: tile
                entity: binary_sensor.patio_motion_right
                name: Patio Motion
                icon: mdi:motion-sensor
                tap_action:
                  action: more-info
                  haptic: selection

              - type: tile
                entity: binary_sensor.guest_bedroom_motion
                name: Guest Bedroom Motion
                icon: mdi:motion-sensor
                tap_action:
                  action: more-info
                  haptic: selection

              - type: tile
                entity: binary_sensor.vibration_sensor_vibration
                name: Vibration Sensor
                icon: mdi:vibrate
                tap_action:
                  action: more-info
