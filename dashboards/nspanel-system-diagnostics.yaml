  # =========================================================================
  # 6. WARNINGS & ALERTS SETTINGS PANEL
  # =========================================================================
  - title: Alerts
    path: alerts
    icon: mdi:shield-alert-outline
    theme: ios-dark-mode
    max_columns: 1
    sections:
      - type: grid
        cards:
          # --- Return Navigation ---
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                name: "Office Panel"
                icon: mdi:briefcase
                layout: icon_name
                tap_action:
                  action: navigate
                  navigation_path: /nspanel-office/office
                styles:
                  card:
                    - height: 44px
                    - border-radius: 12px
                    - background-color: rgba(255, 255, 255, 0.08)
                  icon:
                    - width: 18px
                    - height: 18px
                  name:
                    - font-size: 13px
                    - font-weight: 600
              - type: custom:button-card
                name: "Bedroom Panel"
                icon: mdi:bed
                layout: icon_name
                tap_action:
                  action: navigate
                  navigation_path: /nspanel-main-bedroom/bedroom
                styles:
                  card:
                    - height: 44px
                    - border-radius: 12px
                    - background-color: rgba(255, 255, 255, 0.08)
                  icon:
                    - width: 18px
                    - height: 18px
                  name:
                    - font-size: 13px
                    - font-weight: 600
          # --- Section 0: Patio Security & Alarm Panel ---
          - type: heading
            heading: Patio Security & Alarm
            heading_style: subtitle
            icon: mdi:shield-key

          - type: custom:alarmo-card
            entity: alarm_control_panel.alarmo
            name: Patio Security
            keep_keypad_visible: true

          # --- Section 1: Security Warning Delays ---
          - type: heading
            heading: Security Warning Delays
            heading_style: subtitle
            icon: mdi:shield-clock

          - type: entities
            entities:
              - entity: input_number.warning_patio_door_unlocked_delay
                name: Patio Door Unlocked
                icon: mdi:lock-clock
              - entity: input_number.warning_patio_fence_open_delay
                name: Fence Gate Open
                icon: mdi:gate-alert
              - entity: input_number.warning_front_door_open_delay
                name: Front Door Open
                icon: mdi:door-open
              - entity: input_number.warning_patio_door_open_delay
                name: Patio Door Open
                icon: mdi:door-open
              - entity: input_number.warning_window_open_delay
                name: Window Open
                icon: mdi:window-open-variant

          # --- Section 2: Audio & Screen Alerts ---
          - type: heading
            heading: Audio & Screen Alerts
            heading_style: subtitle
            icon: mdi:volume-vibrate

          - type: entities
            entities:
              - entity: input_number.warning_alert_repeat_interval
                name: Chime Repeat Interval
                icon: mdi:timer-sync
              - entity: switch.zigbee2cube_1002a32fc7_screen_state
                name: Screen Power
                icon: mdi:tablet-dashboard
              - entity: number.zigbee2cube_1002a32fc7_custom_duration
                name: Screen Sleep Timeout (Seconds)
                icon: mdi:timer-outline
              - entity: switch.zigbee2cube_1002a32fc7_proximity_wake
                name: Wake on Proximity
                icon: mdi:hand-wave

          # --- Section 3: Live Warning Status & Preview ---
          - type: heading
            heading: Live Status & Test
            heading_style: subtitle
            icon: mdi:bell-ring-outline

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: binary_sensor.active_security_warnings
                name: Active Warnings
                icon: mdi:shield-alert
              - type: custom:button-card
                name: "🔔 Test Alert Chime"
                icon: mdi:bell-ring
                tap_action:
                  action: call-service
                  haptic: selection
                  service: script.nspanel_audio_feedback
                  data:
                    tone: warning
                styles:
                  card:
                    - height: 56px
                    - padding: 6px 10px
                    - border-radius: var(--ha-card-border-radius, 12px)
                    - background-color: rgba(255, 255, 255, 0.05)
                    - border: 1px solid rgba(255, 255, 255, 0.1)
                  icon:
                    - width: 22px
                    - height: 22px
                    - color: "#BA68C8"
                  name:
                    - font-size: 13px
                    - font-weight: 600
                    - color: var(--primary-text-color)


  # =========================================================================
  # VIEW 7: HOMELAB & CLOSET THERMAL COOLING
  # =========================================================================
  - title: Homelab
    path: homelab
    icon: mdi:server-network
    theme: ios-dark-mode
    max_columns: 1
    sections:
      - type: grid
        cards:
          # --- Return Navigation ---
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:button-card
                name: "Office Panel"
                icon: mdi:briefcase
                layout: icon_name
                tap_action:
                  action: navigate
                  navigation_path: /nspanel-office/office
                styles:
                  card:
                    - height: 44px
                    - border-radius: 12px
                    - background-color: rgba(255, 255, 255, 0.08)
                  icon:
                    - width: 18px
                    - height: 18px
                  name:
                    - font-size: 13px
                    - font-weight: 600
              - type: custom:button-card
                name: "Bedroom Panel"
                icon: mdi:bed
                layout: icon_name
                tap_action:
                  action: navigate
                  navigation_path: /nspanel-main-bedroom/bedroom
                styles:
                  card:
                    - height: 44px
                    - border-radius: 12px
                    - background-color: rgba(255, 255, 255, 0.08)
                  icon:
                    - width: 18px
                    - height: 18px
                  name:
                    - font-size: 13px
                    - font-weight: 600
          # --- Section 1: Kitchen Closet Thermal Cooling Watchdog ---
          - type: heading
            heading: Kitchen Closet Thermal Watchdog
            heading_style: subtitle
            icon: mdi:fan-alert

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.temperature_sensor_temperature
                name: Closet Ambient
                icon: mdi:thermometer
                tap_action:
                  action: more-info

              - type: custom:button-card
                entity: sensor.fan_opnsense_plug_power
                name: Cooling Fan
                icon: mdi:fan
                show_name: true
                show_state: true
                state_display: >-
                  [[[
                    var w = entity.state ? parseFloat(entity.state) : 0;
                    if (w < 3) return 'Off (0W)';
                    if (w < 10) return `Speed 1 (${w}W)`;
                    if (w < 17) return `Speed 2 (${w}W)`;
                    if (w < 24) return `Speed 3 (${w}W)`;
                    return `Speed 4 (${w}W)`;
                  ]]]
                tap_action:
                  action: more-info
                styles:
                  card:
                    - height: 56px
                    - padding: 6px 10px
                    - border-radius: var(--ha-card-border-radius, 12px)
                    - background-color: rgba(255, 255, 255, 0.05)
                    - border: 1px solid rgba(255, 255, 255, 0.1)
                  grid:
                    - grid-template-areas: '"i n" "i s"'
                    - grid-template-columns: 32px 1fr
                    - grid-template-rows: 1fr 1fr
                    - align-items: center
                  icon:
                    - width: 22px
                    - height: 22px
                    - color: >-
                        [[[
                          var w = entity.state ? parseFloat(entity.state) : 0;
                          return w >= 3 ? '#29B6F6' : 'var(--secondary-text-color)';
                        ]]]
                  name:
                    - font-size: 13px
                    - font-weight: 600
                    - justify-self: start
                    - color: var(--primary-text-color)
                  state:
                    - font-size: 11px
                    - font-weight: 500
                    - justify-self: start
                    - color: >-
                        [[[
                          var w = entity.state ? parseFloat(entity.state) : 0;
                          return w >= 3 ? '#29B6F6' : 'var(--secondary-text-color)';
                        ]]]

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.proxmox_host_pve_pve_cpu_package_temperature
                name: PVE CPU Temp
                icon: mdi:cpu-64-bit
                tap_action:
                  action: more-info
              - type: tile
                entity: sensor.proxmox_host_pve_pve_nvme_storage_temperature
                name: NVMe Temp
                icon: mdi:harddisk
                tap_action:
                  action: more-info

          # --- Section 2: Proxmox Host (PVE) ---
          - type: heading
            heading: Proxmox Host (pve)
            heading_style: subtitle
            icon: mdi:server

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: binary_sensor.pve_status
                name: Node Status
                icon: mdi:server
                tap_action:
                  action: more-info
              - type: tile
                entity: sensor.pve_cpu_usage
                name: Host CPU
                icon: mdi:chart-donut
                tap_action:
                  action: more-info
              - type: tile
                entity: sensor.pve_memory_usage_percentage
                name: Host RAM
                icon: mdi:memory
                tap_action:
                  action: more-info
              - type: tile
                entity: sensor.pve_disk_usage
                name: Host Disk
                icon: mdi:database
                tap_action:
                  action: more-info

          # --- Section 3: Instances & Mesh Network ---
          - type: heading
            heading: Instances & Network
            heading_style: subtitle
            icon: mdi:lan

          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: sensor.opnsense_status
                name: OPNsense
                icon: mdi:shield-lock-outline
                tap_action:
                  action: more-info
              - type: tile
                entity: sensor.opnsense_cpu_usage
                name: OPNsense CPU
                icon: mdi:chart-line
                tap_action:
                  action: more-info
              - type: tile
                entity: sensor.docker_status
                name: Docker Host
                icon: mdi:docker
                tap_action:
                  action: more-info
              - type: tile
                entity: sensor.docker_memory_usage_percentage
                name: Docker RAM
                icon: mdi:memory
                tap_action:
                  action: more-info
              - type: tile
                entity: sensor.tailscale_status
                name: Tailscale VPN
                icon: mdi:vpn
                tap_action:
                  action: more-info
              - type: tile
                entity: sensor.tailscale_cpu_usage
                name: Tailscale CPU
                icon: mdi:chart-bell-curve
                tap_action:
                  action: more-info

  # =========================================================================
  # =========================================================================
  # VIEW 8: ENERGY & REAL-TIME POWER MONITORING
  # =========================================================================
  - title: Energy
    path: energy
    icon: mdi:lightning-bolt-circle
    theme: ios-dark-mode
    max_columns: 1
    sections:
    - type: grid
      cards:
      # --- Return Navigation ---
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:button-card
            name: "Office Panel"
            icon: mdi:briefcase
            layout: icon_name
            tap_action:
              action: navigate
              navigation_path: /nspanel-office/office
            styles:
              card:
                - height: 44px
                - border-radius: 12px
                - background-color: rgba(255, 255, 255, 0.08)
              icon:
                - width: 18px
                - height: 18px
              name:
                - font-size: 13px
                - font-weight: 600
          - type: custom:button-card
            name: "Bedroom Panel"
            icon: mdi:bed
            layout: icon_name
            tap_action:
              action: navigate
              navigation_path: /nspanel-main-bedroom/bedroom
            styles:
              card:
                - height: 44px
                - border-radius: 12px
                - background-color: rgba(255, 255, 255, 0.08)
              icon:
                - width: 18px
                - height: 18px
              name:
                - font-size: 13px
                - font-weight: 600
      - type: heading
        heading: Power & Grid Overview
        heading_style: subtitle
        icon: mdi:flash
      - type: custom:button-card
        name: Total Measured Power
        icon: mdi:lightning-bolt
        show_name: true
        show_state: true
        state_display: |-
          [[[
            var plugs = [
              states['sensor.homelab_plug_power'],
              states['sensor.den_pc_plug_power'],
              states['sensor.den_fan_light_power'],
              states['sensor.freezer_plug_power'],
              states['sensor.kitchen_refrigerator_power'],
              states['sensor.fan_opnsense_plug_power'],
              states['sensor.tv_gaming_plug_power'],
              states['sensor.living_room_samsung_oled_power'],
              states['sensor.living_room_samsung_cu7700_43_power'],
              states['sensor.air_purifier_plug_power'],
              states['sensor.bedroom_bed_plug_power'],
              states['sensor.main_bathroom_fan_power'],
              states['sensor.light_patio_left_power']
            ];
            var sum = 0;
            plugs.forEach(function(s) {
              if (s && s.state && !isNaN(parseFloat(s.state))) {
                sum += parseFloat(s.state);
              }
            });
            return Math.round(sum) + ' W';
          ]]]
        tap_action:
          action: more-info
        styles:
          card:
          - min-height: 70px
          - padding: 12px 16px
          - border-radius: var(--ha-card-border-radius, 14px)
          - background: linear-gradient(135deg, rgba(255, 179, 0, 0.18) 0%, rgba(255,
              111, 0, 0.08) 100%)
          - border: 1.5px solid rgba(255, 179, 0, 0.4)
          - box-shadow: 0 0 14px rgba(255, 179, 0, 0.15)
          grid:
          - grid-template-areas: '"i n" "i s"'
          - grid-template-columns: 44px 1fr
          - grid-template-rows: auto auto
          - align-items: center
          icon:
          - width: 28px
          - height: 28px
          - color: "#FFB300"
          - background-color: rgba(255, 179, 0, 0.2)
          - border-radius: 10px
          - padding: 6px
          name:
          - font-size: 13px
          - font-weight: 600
          - justify-self: start
          - color: var(--primary-text-color)
          state:
          - font-size: 20px
          - font-weight: 700
          - justify-self: start
          - color: "#FFD54F"
      - type: grid
        columns: 2
        square: false
        cards:
        - type: custom:button-card
          entity: sensor.bc_hydro_mission_cost_to_date
          name: |-
            [[[
              var s = states['sensor.bc_hydro_mission_billing_period_start'];
              var d = (s && s.state && s.state !== 'unknown') ? new Date(s.state) : new Date('2026-10-21');
              var m = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
              return `BC Hydro (Since ${m})`;
            ]]]
          icon: mdi:transmission-tower
          show_name: true
          show_state: true
          state_display: |-
            [[[
              var cost = states['sensor.bc_hydro_mission_cost_to_date'] ? states['sensor.bc_hydro_mission_cost_to_date'].state : '0';
              var kwh = states['sensor.bc_hydro_mission_consumption_to_date'] ? states['sensor.bc_hydro_mission_consumption_to_date'].state : '0';
              return `$${cost} • ${kwh} kWh`;
            ]]]
          tap_action:
            action: more-info
          styles:
            card:
            - min-height: 58px
            - padding: 8px 10px
            - border-radius: var(--ha-card-border-radius, 12px)
            - background-color: rgba(255, 255, 255, 0.05)
            - border: 1px solid rgba(76, 175, 80, 0.3)
            grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 32px 1fr
            - grid-template-rows: 1fr 1fr
            - align-items: center
            icon:
            - width: 22px
            - height: 22px
            - color: "#4CAF50"
            name:
            - font-size: 13px
            - font-weight: 600
            - justify-self: start
            - color: var(--primary-text-color)
            state:
            - font-size: 11px
            - font-weight: 500
            - justify-self: start
            - color: "#81C784"
        - type: custom:button-card
          entity: sensor.bc_hydro_mission_yesterday_cost
          name: |-
            [[[
              var days = states['sensor.bc_hydro_mission_days_in_billing_period'] ? states['sensor.bc_hydro_mission_days_in_billing_period'].state : '58';
              var prog = states['sensor.bc_hydro_mission_billing_period_progress'] ? states['sensor.bc_hydro_mission_billing_period_progress'].state : '21';
              return `Cycle: ${prog}% of ${days}d`;
            ]]]
          icon: mdi:calendar-clock
          show_name: true
          show_state: true
          state_display: |-
            [[[
              var y_cost = states['sensor.bc_hydro_mission_yesterday_cost'] ? states['sensor.bc_hydro_mission_yesterday_cost'].state : '0';
              var c = states['sensor.bc_hydro_mission_cost_to_date'];
              var k = states['sensor.bc_hydro_mission_consumption_to_date'];
              var rate = 13.1;
              if (c && k && parseFloat(k.state) > 0) {
                rate = ((parseFloat(c.state) / parseFloat(k.state)) * 100).toFixed(1);
              }
              return `Yest $${y_cost} • ${rate}¢/kWh`;
            ]]]
          tap_action:
            action: more-info
