                cond = cond.toLowerCase();
                if (cond.includes('rain') || cond.includes('pour')) return 'mdi:weather-rainy';
                if (cond.includes('snow')) return 'mdi:weather-snowy';
                if (cond.includes('clear') || cond.includes('sunny')) return 'mdi:weather-sunny';
                if (cond.includes('partly')) return 'mdi:weather-partly-cloudy';
                if (cond.includes('wind')) return 'mdi:weather-windy';
                if (cond.includes('fog')) return 'mdi:weather-fog';
                if (cond.includes('lightning') || cond.includes('storm')) return 'mdi:weather-lightning';
                return 'mdi:weather-cloudy';
              ]]]
