            - font-weight: 600
            - justify-self: start
            - color: var(--primary-text-color)
            state:
            - font-size: 11px
            - font-weight: 500
            - justify-self: start
            - color: var(--secondary-text-color)
        - type: custom:button-card
          entity: sensor.den_pc_plug_power
          name: Office PC Plug
          icon: mdi:laptop
          show_name: true
          show_state: true
          state_display: |-
            [[[
              var w = entity.state ? parseFloat(entity.state).toFixed(0) : '0';
              var kwh_state = states['sensor.den_pc_plug_energy'];
              var raw_kwh = (kwh_state && kwh_state.state) ? parseFloat(kwh_state.state) : 0;
              var baselines_str = states['input_text.energy_billing_cycle_baselines'] ? states['input_text.energy_billing_cycle_baselines'].state : '';
              var base = 21.93;
              try {
                var b = JSON.parse(baselines_str);
                if (b && b['den_pc'] != null) base = parseFloat(b['den_pc']);
              } catch(e){}
              var period_kwh = Math.max(0, raw_kwh - base);
              var c = states['sensor.bc_hydro_mission_cost_to_date'];
              var k = states['sensor.bc_hydro_mission_consumption_to_date'];
              var rate = 0.1312;
              if (c && k && parseFloat(k.state) > 0) rate = parseFloat(c.state) / parseFloat(k.state);
              var cost = (period_kwh * rate).toFixed(2);
              return `${w}W • ${period_kwh.toFixed(1)}kWh ($${cost})`;
            ]]]
          tap_action:
            action: more-info
          styles:
            card:
            - min-height: 58px
            - padding: 8px 10px
            - border-radius: var(--ha-card-border-radius, 12px)
            - background-color: rgba(255, 255, 255, 0.05)
            - border: 1px solid rgba(255, 255, 255, 0.1)
            grid:
            - grid-template-areas: '"i n" "i s"'
            - grid-template-columns: 32px 1fr
            - grid-template-rows: 1fr 1fr
            - align-items: center
            icon:
            - width: 22px
            - height: 22px
            - color: "#FFB300"
            name:
            - font-size: 13px
            - font-weight: 600
            - justify-self: start
            - color: var(--primary-text-color)
            state:
            - font-size: 11px
            - font-weight: 500
            - justify-self: start
            - color: var(--secondary-text-color)
