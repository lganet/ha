          # --- Resilient Cached Weather Card (Never breaks or disappears) ---
          - type: custom:button-card
            entity: weather.forecast_home
            name: >-
              [[[
                var w = entity;
                var cached = window._nspanel_cached_weather || {};
                if (w && w.state && w.state !== 'unavailable' && w.state !== 'unknown') {
                  cached.state = w.state;
                  cached.temp = w.attributes.temperature;
                  cached.humidity = w.attributes.humidity;
                  cached.wind = w.attributes.wind_speed;
                  cached.time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                  window._nspanel_cached_weather = cached;
                  try { localStorage.setItem('nspanel_cached_weather', JSON.stringify(cached)); } catch(e){}
                } else if (!cached.state) {
                  try {
                    var s = localStorage.getItem('nspanel_cached_weather');
                    if (s) { cached = JSON.parse(s); window._nspanel_cached_weather = cached; }
                  } catch(e){}
                }
                var cond = (w && w.state && w.state !== 'unavailable' && w.state !== 'unknown') ? w.state : (cached.state || 'Cloudy');
                cond = cond.replace(/[-_]/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                var isCached = (!w || w.state === 'unavailable' || w.state === 'unknown');
                return cond + (isCached ? ' (Cached)' : '');
              ]]]
            state_display: >-
              [[[
                var cached = window._nspanel_cached_weather || {};
                var w = entity;
                var temp = (w && w.attributes && w.attributes.temperature != null && w.state !== 'unavailable') ? w.attributes.temperature : (cached.temp != null ? cached.temp : '--');
                var hum = (w && w.attributes && w.attributes.humidity != null && w.state !== 'unavailable') ? w.attributes.humidity : (cached.humidity != null ? cached.humidity : '--');
                var wind = (w && w.attributes && w.attributes.wind_speed != null && w.state !== 'unavailable') ? w.attributes.wind_speed : (cached.wind != null ? cached.wind : '--');
                return `${temp}°C • Humidity ${hum}% • Wind ${wind} km/h`;
              ]]]
            show_name: true
            show_state: true
            show_icon: true
            icon: >-
              [[[
                var w = entity;
                var cached = window._nspanel_cached_weather || {};
                var cond = (w && w.state && w.state !== 'unavailable') ? w.state : (cached.state || 'cloudy');
                cond = cond.toLowerCase();
                if (cond.includes('rain') || cond.includes('pour')) return 'mdi:weather-rainy';
                if (cond.includes('snow')) return 'mdi:weather-snowy';
                if (cond.includes('clear') || cond.includes('sunny')) return 'mdi:weather-sunny';
                if (cond.includes('partly')) return 'mdi:weather-partly-cloudy';
                if (cond.includes('wind')) return 'mdi:weather-windy';
                if (cond.includes('fog')) return 'mdi:weather-fog';
                if (cond.includes('lightning') || cond.includes('storm')) return 'mdi:weather-lightning';
                return 'mdi:weather-cloudy';
              ]]]
            tap_action:
              action: more-info
              haptic: selection
            styles:
              card:
                - min-height: 64px
                - padding: 10px 14px
                - border-radius: var(--ha-card-border-radius, 14px)
                - background: "linear-gradient(135deg, rgba(33, 150, 243, 0.15) 0%, rgba(13, 71, 161, 0.08) 100%)"
                - border: "1px solid rgba(33, 150, 243, 0.25)"
                - box-shadow: "0 2px 8px rgba(0, 0, 0, 0.2)"
              grid:
                - grid-template-areas: '"i n" "i s"'
                - grid-template-columns: 42px 1fr
                - grid-template-rows: auto auto
                - align-items: center
              icon:
                - width: 26px
                - height: 26px
                - color: "#42A5F5"
                - background-color: "rgba(33, 150, 243, 0.15)"
                - border-radius: 10px
                - padding: 6px
