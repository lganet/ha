                      [[[
                        if (entity.state !== 'on') return 'Off';
                        var pct = entity.attributes.percentage || 0;
                        var spd = Math.round(pct / 16.6667) || 1;
                        return 'Speed ' + spd;
                      ]]]
                    tap_action:
                      action: toggle
