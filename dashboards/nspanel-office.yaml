        show_icon: true

    sections:
      - type: grid
        cards:
          - type: heading
            heading: Climate Controls
            heading_style: subtitle
            icon: mdi:thermostat

          # --- Ceiling Fan Control (Discrete Speeds 1-6 & Direction) ---
          - type: custom:stack-in-card
            mode: vertical
            layout_options:
              grid_columns: 4
            grid_options:
              columns: full
            styles:
              card:
                - border-radius: var(--ha-card-border-radius, 16px)
                - background-color: var(--ha-card-background, rgba(255, 255, 255, 0.05))
                - padding: 10px 12px 12px 12px
                - box-sizing: border-box
            cards:
              - type: grid
                columns: 2
                square: false
                cards:
                  - type: custom:button-card
                    entity: fan.office_ceiling_fan
                    name: Ceiling Fan
                    show_name: true
                    show_state: true
                    show_icon: true
                    icon: mdi:fan
                    state_display: >-
                      [[[
                        if (entity.state !== 'on') return 'Off';
                        var pct = entity.attributes.percentage || 0;
                        var spd = Math.round(pct / 16.6667) || 1;
                        return 'Speed ' + spd;
                      ]]]
                    tap_action:
                      action: toggle
                      haptic: selection
                    styles:
                      card:
                        - min-height: 54px
                        - padding: 6px 10px
                        - border-radius: 12px
                        - background-color: >-
                            [[[
                              return entity.state === 'on' ? 'rgba(41, 182, 246, 0.15)' : 'rgba(255, 255, 255, 0.05)';
                            ]]]
                        - border: >-
                            [[[
                              return entity.state === 'on' ? '1px solid rgba(41, 182, 246, 0.4)' : '1px solid rgba(255, 255, 255, 0.08)';
                            ]]]
                      grid:
                        - grid-template-areas: '"i n" "i s"'
                        - grid-template-columns: 32px 1fr
                        - grid-template-rows: 1fr 1fr
                        - align-items: center
                      icon:
                        - width: 24px
                        - height: 24px
                        - color: >-
                            [[[
                              return entity.state === 'on' ? '#29B6F6' : 'var(--secondary-text-color, #888888)';
                            ]]]
                        - animation: >-
                            [[[
                              if (entity.state !== 'on') return 'none';
                              var pct = entity.attributes.percentage || 50;
                              var dur = Math.max(0.5, (2.2 - (pct / 50))).toFixed(1);
                              var dir = entity.attributes.direction === 'reverse' ? 'spin-ccw' : 'spin-cw';
                              return `${dir} ${dur}s linear infinite`;
                            ]]]
                      name:
                        - font-size: 13px
                        - font-weight: 600
                        - justify-self: start
                        - color: var(--primary-text-color)
                      state:
                        - font-size: 11px
                        - font-weight: 500
                        - justify-self: start
                        - color: >-
                            [[[
                              return entity.state === 'on' ? '#29B6F6' : 'var(--secondary-text-color)';
                            ]]]
                    extra_styles: |
                      @keyframes spin-cw {
                        0% { transform: rotate(0deg); }
                        100% { transform: rotate(360deg); }
                      }
                      @keyframes spin-ccw {
                        0% { transform: rotate(360deg); }
                        100% { transform: rotate(0deg); }
                      }

