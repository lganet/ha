id: "1756982400000"
alias: Patio cameras start livestream on motion
description: Start P2P livestream when motion detected on patio cameras
mode: single
labels:
  - git_managed
triggers:
  - trigger: state
    entity_id: binary_sensor.patio_right_motion_detected
    to: "on"
    id: patio_right_motion
  - trigger: state
    entity_id: binary_sensor.patio_left_motion_detected
    to: "on"
    id: patio_left_motion
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: patio_right_motion
        sequence:
          - action: eufy_security.start_p2p_livestream
            target:
              entity_id: camera.patio_right
      - conditions:
          - condition: trigger
            id: patio_left_motion
        sequence:
          - action: eufy_security.start_p2p_livestream
            target:
              entity_id: camera.patio_left
