id: "1794019200002"
alias: "IKEA Button 2 - Patio Light, Lock & Camera Controls"
description: "Controls Left Patio Light (toggle on click ON), Patio Door Lock (toggle on click OFF), and Google Hub Max camera streams (Left and Right arrows) via IKEA STYRBAR (Button 2)."
mode: restart
labels:
  - git_managed

triggers:
  # Single Press ON -> Toggle Left Patio Light
  - trigger: mqtt
    topic: "zigbee2mqtt/Ikea button 2/action"
    payload: "on"
    id: press_on
  - trigger: device
    domain: mqtt
    device_id: 05576871ebba04eaacde799001c53603
    type: action
    subtype: "on"
    id: press_on

  # Single Press OFF -> Toggle Patio Door Lock
  - trigger: mqtt
    topic: "zigbee2mqtt/Ikea button 2/action"
    payload: "off"
    id: press_off
  - trigger: device
    domain: mqtt
    device_id: 05576871ebba04eaacde799001c53603
    type: action
    subtype: "off"
    id: press_off

  # Press LEFT Arrow -> Stream Right Camera to Google Nest Hub Max
  - trigger: mqtt
    topic: "zigbee2mqtt/Ikea button 2/action"
    payload: "arrow_left_click"
    id: click_left
  - trigger: device
    domain: mqtt
    device_id: 05576871ebba04eaacde799001c53603
    type: action
    subtype: "arrow_left_click"
    id: click_left

  # Press RIGHT Arrow -> Stream Left Camera to Google Nest Hub Max
  - trigger: mqtt
    topic: "zigbee2mqtt/Ikea button 2/action"
    payload: "arrow_right_click"
    id: click_right
  - trigger: device
    domain: mqtt
    device_id: 05576871ebba04eaacde799001c53603
    type: action
    subtype: "arrow_right_click"
    id: click_right

actions:
  - choose:
      # Single Press ON -> Toggle Left Patio Light
      - conditions:
          - condition: trigger
            id: press_on
        sequence:
          - action: switch.toggle
            target:
              entity_id: switch.patio_left_light_switch

      # Single Press OFF -> Toggle Patio Door Lock (lock if unlocked, unlock if locked)
      - conditions:
          - condition: trigger
            id: press_off
        sequence:
          - if:
              - condition: state
                entity_id: lock.patio_door_lock
                state: "locked"
            then:
              - action: lock.unlock
                target:
                  entity_id: lock.patio_door_lock
            else:
              - action: lock.lock
                target:
                  entity_id: lock.patio_door_lock

      # Press LEFT Arrow -> Stream Right Camera to Google Nest Hub Max
      - conditions:
          - condition: trigger
            id: click_left
        sequence:
          - action: script.stream_patio_camera_to_hub
            data:
              camera_entity: camera.patio_right

      # Press RIGHT Arrow -> Stream Left Camera to Google Nest Hub Max
      - conditions:
          - condition: trigger
            id: click_right
        sequence:
          - action: script.stream_patio_camera_to_hub
            data:
              camera_entity: camera.patio_left
