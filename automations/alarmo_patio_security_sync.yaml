id: "1793855799214"
alias: "Alarmo Patio Security & Lock Synchronization"
description: "Synchronizes Alarmo states with Patio Cameras (GusHomeBase) and unlocks the Patio Door Lock when Alarmo is disarmed with a user code."
mode: queued
max: 5
trigger:
  - platform: state
    entity_id: alarm_control_panel.alarmo
    id: alarmo_state
  - platform: state
    entity_id: alarm_control_panel.gushomebase
    id: gushomebase_state
condition:
  - condition: template
    value_template: >-
      {{ trigger.from_state is not none and trigger.to_state is not none and trigger.from_state.state != trigger.to_state.state }}
action:
  - choose:
      - conditions:
          - condition: trigger
            id: alarmo_state
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.to_state.state == 'disarmed' }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ states('alarm_control_panel.gushomebase') != 'disarmed' }}"
                    then:
                      - action: alarm_control_panel.alarm_disarm
                        target:
                          entity_id: alarm_control_panel.gushomebase
                  - if:
                      - condition: state
                        entity_id: lock.patio_door_lock
                        state: locked
                    then:
                      - action: lock.unlock
                        target:
                          entity_id: lock.patio_door_lock
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.to_state.state == 'armed_home' }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ states('alarm_control_panel.gushomebase') != 'armed_home' }}"
                    then:
                      - action: alarm_control_panel.alarm_arm_home
                        target:
                          entity_id: alarm_control_panel.gushomebase
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.to_state.state == 'armed_away' }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ states('alarm_control_panel.gushomebase') != 'armed_away' }}"
                    then:
                      - action: alarm_control_panel.alarm_arm_away
                        target:
                          entity_id: alarm_control_panel.gushomebase

      - conditions:
          - condition: trigger
            id: gushomebase_state
        sequence:
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.to_state.state == 'armed_home' and states('alarm_control_panel.alarmo') != 'armed_home' }}"
                sequence:
                  - action: alarm_control_panel.alarm_arm_home
                    target:
                      entity_id: alarm_control_panel.alarmo
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.to_state.state == 'armed_away' and states('alarm_control_panel.alarmo') != 'armed_away' }}"
                sequence:
                  - action: alarm_control_panel.alarm_arm_away
                    target:
                      entity_id: alarm_control_panel.alarmo
              - conditions:
                  - condition: template
                    value_template: "{{ trigger.to_state.state == 'disarmed' and states('alarm_control_panel.alarmo') != 'disarmed' }}"
                sequence:
                  - action: alarm_control_panel.alarm_disarm
                    target:
                      entity_id: alarm_control_panel.alarmo
