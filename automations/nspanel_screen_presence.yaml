id: "1793854234460"
alias: NSPanel Screen Presence Control
description: Automatically turns on the NSPanel Pro display when office presence is detected and turns it off when the room has been clear for 2 minutes, ensuring the screen remains on if any security warning is active.
mode: restart
triggers:
  - trigger: state
    entity_id: binary_sensor.office_presence_fp300
    to: "on"
    id: presence_detected
  - trigger: state
    entity_id: binary_sensor.office_presence_fp300
    to: "off"
    for: "00:02:00"
    id: presence_cleared
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: presence_detected
        sequence:
          - action: switch.turn_on
            target:
              entity_id: switch.zigbee2cube_1002a32fc7_screen_state

      - conditions:
          - condition: trigger
            id: presence_cleared
          - condition: state
            entity_id: binary_sensor.active_security_warnings
            state: "off"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: switch.zigbee2cube_1002a32fc7_screen_state
